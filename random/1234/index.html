<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #1b1b1b;
    color: #eee;
    font-family: sans-serif;
  }
  #info { display: flex; justify-content: space-between; width: 320px; font-size: 14px; }
  canvas { background: #111; border: 1px solid #444; border-radius: 6px; }
  .controls { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 40px); gap: 4px; }
  button {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
  }
  button:hover { background: #3a3a3a; }
  #restart { grid-column: span 3; width: 160px; padding: 6px; }
</style>
</head>
<body>
  <div id="info">
    <span>Score: <span id="score">0</span></span>
    <span id="status">Use arrow keys</span>
  </div>
  <canvas id="board" width="320" height="320"></canvas>
  <div class="controls">
    <div></div>
    <button id="up">&#8593;</button>
    <div></div>
    <button id="left">&#8592;</button>
    <button id="down">&#8595;</button>
    <button id="right">&#8594;</button>
  </div>
  <button id="restart">Restart</button>

<script>
(function(){
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var cell = 16, cols = 20, rows = 20;
  var snake, dir, nextDir, food, score, alive, timer;

  function rndFood(){
    var p;
    do {
      p = {x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows)};
    } while (snake.some(function(s){return s.x===p.x && s.y===p.y;}));
    return p;
  }

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    food = rndFood();
    score = 0;
    alive = true;
    document.getElementById('score').textContent = '0';
    document.getElementById('status').textContent = 'Use arrow keys';
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 110);
    draw();
  }

  function tick(){
    if (!alive) return;
    dir = nextDir;
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || snake.some(function(s){return s.x===head.x && s.y===head.y;})) {
      alive = false;
      clearInterval(timer);
      document.getElementById('status').textContent = 'Game over — restart';
      draw();
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 1;
      document.getElementById('score').textContent = String(score);
      food = rndFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#e05555';
    ctx.fillRect(food.x*cell, food.y*cell, cell-1, cell-1);
    snake.forEach(function(s, i){
      ctx.fillStyle = i === 0 ? '#8fe08f' : '#4caf50';
      ctx.fillRect(s.x*cell, s.y*cell, cell-1, cell-1);
    });
  }

  function setDir(x,y){
    if (dir.x === -x && dir.y === -y) return;
    nextDir = {x:x,y:y};
  }

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowUp') setDir(0,-1);
    else if (e.key === 'ArrowDown') setDir(0,1);
    else if (e.key === 'ArrowLeft') setDir(-1,0);
    else if (e.key === 'ArrowRight') setDir(1,0);
    else return;
    e.preventDefault();
  });

  document.getElementById('up').addEventListener('click', function(){ setDir(0,-1); });
  document.getElementById('down').addEventListener('click', function(){ setDir(0,1); });
  document.getElementById('left').addEventListener('click', function(){ setDir(-1,0); });
  document.getElementById('right').addEventListener('click', function(){ setDir(1,0); });
  document.getElementById('restart').addEventListener('click', reset);

  reset();
})();
</script>
</body>
</html>
