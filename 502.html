<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>502 Bad Gateway | Wind Developers</title>
    <meta name="robots" content="noindex">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            overflow: hidden;
        }

        .card {
            position: relative;
            z-index: 2;
        }

        .logo { height: 44px; margin-bottom: 28px; }

        .code {
            font-size: clamp(90px, 22vw, 170px);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(90deg, #f97316, #fbbf24, #f97316);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }

        h1 {
            font-size: clamp(18px, 4vw, 26px);
            margin: 16px 0 12px;
            color: #f8fafc;
            letter-spacing: 1px;
        }

        p {
            color: #94a3b8;
            max-width: 460px;
            margin: 0 auto 28px;
            line-height: 1.7;
            font-size: 15px;
        }

        .btn {
            display: inline-block;
            padding: 13px 34px;
            background: linear-gradient(90deg, #f97316, #fbbf24);
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 700;
            font-size: 14px;
            transition: transform .2s, box-shadow .2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(249,115,22,.35); }

        /* Wind lines animation */
        .wind {
            position: fixed;
            left: -30%;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, rgba(251,191,36,.4), transparent);
            animation: blow 5s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        .wind:nth-child(1) { top: 18%; width: 220px; animation-delay: 0s; }
        .wind:nth-child(2) { top: 42%; width: 320px; animation-delay: 1.5s; }
        .wind:nth-child(3) { top: 68%; width: 160px; animation-delay: 3s; }
        .wind:nth-child(4) { top: 84%; width: 260px; animation-delay: .8s; }

        @keyframes blow {
            0%   { left: -30%; opacity: 0; }
            15%  { opacity: 1; }
            85%  { opacity: 1; }
            100% { left: 110%; opacity: 0; }
        }

        footer {
            position: fixed;
            bottom: 16px;
            left: 0;
            right: 0;
            font-size: 13px;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="wind"></div>
    <div class="wind"></div>
    <div class="wind"></div>
    <div class="wind"></div>

    <div class="card">
        <img src="logo.png" alt="Wind Developers" class="logo">
        <div class="code">502</div>
        <h1>Bad Gateway</h1>
        <p>The requested request was not found on this server port. The request should not be repeated.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>

    <footer>© 2026 Wind Developers. All rights reserved.</footer>
</body>
</html>
