<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
</head>
<body>

    <table width="100%" height="100%" border="0" cellpadding="0" cellspacing="0" style="position: absolute; top: 0; left: 0; height: 100%; width: 100%;">
        <tr>
            <td align="center" valign="middle">
                
                <table border="0" cellpadding="10" cellspacing="0">
                    <tr>
                        <td valign="middle">
                            <font face="sans-serif" size="4" color="#000000">
                                The URL you are trying to access does not exist on this port. 
                                <br>
                                <strong>Error code: not_found_url</strong>
                            </font>
                        </td>
                        
                        <td valign="middle">
                            <img src="error.jfif" width="80" height="80" alt="Error Visual" style="object-fit: cover;">
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
