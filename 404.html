<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Wind Developers</title>
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }

  .logo { height: 48px; margin-bottom: 32px; }

  .code {
    font-size: clamp(90px, 22vw, 180px);
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
  }

  @keyframes shine { to { background-position: 200% center; } }

  h1 { font-size: clamp(20px, 4vw, 28px); margin: 16px 0 8px; color: #f8fafc; }

  p { color: #94a3b8; max-width: 440px; margin-bottom: 32px; line-height: 1.6; }

  .btn {
    display: inline-block;
    padding: 14px 36px;
    background: linear-gradient(90deg, #0ea5e9, #6366f1);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(56,189,248,.35); }

  /* Wind lines animation */
  .wind { position: fixed; left: -30%; height: 2px; border-radius: 2px;
          background: linear-gradient(90deg, transparent, rgba(56,189,248,.5), transparent);
          animation: blow 5s linear infinite; pointer-events: none; }
  .wind:nth-child(1) { top: 20%; width: 200px; animation-delay: 0s; }
  .wind:nth-child(2) { top: 45%; width: 300px; animation-delay: 1.5s; }
  .wind:nth-child(3) { top: 70%; width: 150px; animation-delay: 3s; }
  .wind:nth-child(4) { top: 85%; width: 250px; animation-delay: .8s; }

  @keyframes blow {
    0%   { left: -30%; opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { left: 110%; opacity: 0; }
  }

  footer { position: fixed; bottom: 16px; font-size: 13px; color: #475569; }
</style>
</head>
<body>
  <div class="wind"></div>
  <div class="wind"></div>
  <div class="wind"></div>
  <div class="wind"></div>

  <img src="logo.png" alt="Wind Developers" class="logo">
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>Oops! The page you're looking for seems to have blown away with the wind. Let's get you back on track.</p>
  <a href="/" class="btn">Back to Home</a>

  <footer>© 2026 Wind Developers. All rights reserved.</footer>
</body>
</html>
