<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Wind Developers</title>
    <style>
        body {
            margin: 0;
            background: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .container-table {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            padding: 32px 40px;
        }
        .logo { height: 36px; margin-bottom: 20px; display: block; }
        .error-img {
            width: 80px; height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-left: 24px;
        }
        .message { color: #334155; font-size: 16px; line-height: 1.6; }
        .error-code { color: #0ea5e9; font-weight: 700; font-size: 14px; margin-top: 8px; display: block; }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <table class="container-table" border="0" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center" valign="middle">
                <div class="card">
                    <img src="logo.png" alt="Wind Developers" class="logo">
                    
                    <table border="0" cellpadding="0" cellspacing="0">
                        <tr>
                            <td valign="middle">
                                <span class="message">
                                    The URL you are trying to access does not exist on this port.
                                    <span class="error-code">Error code: not_found_url</span>
                                    <a href="/" class="back-link">← Back to Home</a>
                                </span>
                            </td>
                            <td valign="middle">
                                <img src="error.jfif" width="80" height="80" alt="Error Visual" class="error-img">
                            </td>
                        </tr>
                    </table>
                </div>
            </td>
        </tr>
    </table>

</body>
</html>
