<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pilot AI Download Center | Wind Developers Corporation</title>
    <meta name="description" content="Download Pilot AI Desktop Beta and Beta Version Desktop License keys provided by Wind Developers Corporation.">
    <meta name="author" content="Wind Developers Corporation">
    <meta name="robots" content="index, follow">

    <link rel="icon" type="image/png" href="https://winddevelopers.duckdns.org/logo.png">
    <link rel="apple-touch-icon" href="https://winddevelopers.duckdns.org/logo.png">

    <style>
        :root {
            --primary-color: #0067b8;
            --dark-bg: #111111;
            --light-bg: #f2f2f2;
            --text-color: #242424;
            --text-light: #505050;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            color: var(--text-color);
            background-color: #fff;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 700;
            font-size: 1.3rem;
        }

        .logo-area img {
            height: 32px;
            width: auto;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 24px;
        }

        nav ul a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition);
        }

        nav ul a:hover {
            color: var(--primary-color);
        }

        .lang-switcher {
            background: #fff;
            border: 1px solid #8a8a8a;
            padding: 5px 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 2px;
        }

        .lang-switcher:hover {
            background: var(--light-bg);
            border-color: var(--text-color);
        }

        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f3f2f1 0%, #e1dfdd 100%);
            padding: 60px 5%;
        }

        .download-container {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            border-radius: 4px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .download-container h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 35px;
            color: #000;
        }

        .download-section {
            margin-bottom: 35px;
            padding-bottom: 25px;
            text-align: left;
        }

        .download-section:first-of-type {
            border-bottom: 1px dashed #e0e0e0;
        }

        .download-section:last-of-type {
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .download-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 12px;
            display: block;
        }

        .download-btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: #fff;
            padding: 12px 32px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
            border-radius: 2px;
            width: 100%;
            text-align: center;
        }

        .download-btn:hover {
            background-color: #005293;
            box-shadow: var(--card-shadow);
        }

        footer {
            background-color: var(--light-bg);
            padding: 30px 5%;
            border-top: 1px solid #e0e0e0;
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .footer-bottom {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }
            .nav-right {
                flex-direction: column;
                gap: 15px;
            }
            .download-container {
                padding: 30px 20px;
            }
            .footer-bottom {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="https://winddevelopers.duckdns.org/" class="logo-area" aria-label="Wind Developers Home">
                <img src="https://winddevelopers.duckdns.org/logo.png" alt="Wind Developers Corporation Logo">
                <span>Wind Developers</span>
            </a>
            <div class="nav-right">
                <nav aria-label="Main navigation">
                    <ul>
                        <li><a href="https://winddevelopers.duckdns.org/#products" id="nav-products">Products</a></li>
                        <li><a href="https://winddevelopers.duckdns.org/#about" id="nav-about">Corporate</a></li>
                        <li><a href="https://developerswind.vercel.app/" target="_blank" rel="noopener" id="nav-studio">Developers Studio</a></li>
                    </ul>
                </nav>
                <button class="lang-switcher" onclick="toggleLanguage()" id="lang-btn" aria-label="Switch language">TR</button>
            </div>
        </div>
    </header>

    <main>
        <div class="download-container">
            <h1 id="page-main-title">Pilot AI Download Center</h1>
            
            <div class="download-section">
                <span class="download-label">Download pilotai beta version desktop licance</span>
                <a href="https://gofile.io/d/LadP7a" target="_blank" rel="noopener" class="download-btn" id="btn-license">Download License</a>
            </div>

            <div class="download-section">
                <span class="download-label">Pilot ai desktop beta download</span>
                <a href="https://gofile.io/d/3ZuDJX" target="_blank" rel="noopener" class="download-btn" id="btn-app">Download Desktop Beta</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-bottom">
            <span id="footer-copy">&copy; 2026 Wind Developers Corporation. All rights reserved.</span>
            <span>Simply Powerful.</span>
        </div>
    </footer>

    <script>
        const translations = {
            en: {
                pageTitle: "Pilot AI Download Center | Wind Developers Corporation",
                navProducts: "Products",
                navAbout: "Corporate",
                navStudio: "Developers Studio",
                mainTitle: "Pilot AI Download Center",
                btnLicenseText: "Download License",
                btnAppText: "Download Desktop Beta",
                footerCopy: "© 2026 Wind Developers Corporation. All rights reserved.",
                btnText: "TR"
            },
            tr: {
                pageTitle: "Pilot AI İndirme Merkezi | Wind Developers Corporation",
                navProducts: "Ürünlerimiz",
                navAbout: "Kurumsal",
                navStudio: "Developers Studio",
                mainTitle: "Pilot AI İndirme Merkezi",
                btnLicenseText: "Lisansı İndir",
                btnAppText: "Masaüstü Beta İndir",
                footerCopy: "© 2026 Wind Developers Corporation. Tüm hakları saklıdır.",
                btnText: "EN"
            }
        };

        let currentLang = 'en';

        function applyTranslations(lang) {
            const t = translations[lang];
            document.documentElement.lang = lang;
            document.title = t.pageTitle;

            document.getElementById('nav-products').innerText = t.navProducts;
            document.getElementById('nav-about').innerText = t.navAbout;
            document.getElementById('nav-studio').innerText = t.navStudio;
            
            document.getElementById('page-main-title').innerText = t.mainTitle;
            document.getElementById('btn-license').innerText = t.btnLicenseText;
            document.getElementById('btn-app').innerText = t.btnAppText;
            
            document.getElementById('footer-copy').innerText = t.footerCopy;
            document.getElementById('lang-btn').innerText = t.btnText;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'tr' : 'en';
            applyTranslations(currentLang);
        }

        if (new URLSearchParams(window.location.search).get('lang') === 'tr') {
            currentLang = 'tr';
            applyTranslations('tr');
        }
    </script>
</body>
</html>
